<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>三个小测试</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #f5f1e8; color: #2b2620;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif;
    line-height: 1.9; min-height: 100vh; padding: 60px 22px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .sub { color: #8c8378; font-size: 14px; margin-bottom: 40px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #fffdf8; border: 1px solid #e4ddd0; border-radius: 3px;
    padding: 22px 20px; margin-bottom: 14px;
    transition: border-color .18s, transform .1s;
  }
  a.card:active { transform: scale(.995); }
  a.card:hover { border-color: #c9bda9; }
  .t { font-size: 19px; letter-spacing: 2px; margin-bottom: 6px; }
  .d { font-size: 13.5px; color: #8c8378; letter-spacing: .5px; }
  .foot { margin-top: 40px; font-size: 12px; color: #a89e90; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>三个小测试</h1>

  <a class="card" href="%E5%8F%A4%E4%BA%BA%E6%B5%8B%E8%AF%95.html">
    <div class="t">你身上住着哪位古人</div>

  </a>

  <a class="card" href="%E8%B6%85%E8%83%BD%E5%8A%9B%E6%B5%8B%E8%AF%95.html">

</div>
