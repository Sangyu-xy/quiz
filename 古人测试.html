<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>你身上住着哪位古人</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f5f1e8;
    color: #2b2620;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif;
    line-height: 1.9;
    min-height: 100vh;
    padding: 0 0 56px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 22px; }

  #cover { padding-top: 15vh; text-align: center; }
  #cover h1 { font-size: 29px; letter-spacing: 5px; font-weight: 600; margin: 0 0 16px; }
  #cover .line { width: 38px; height: 1px; background: #c9bda9; margin: 26px auto 26px; }
  #cover p { font-size: 15px; color: #6a6156; margin: 7px 0; }
  .hintline { margin-top: 24px; font-size: 13px; color: #9c9285; }

  .btn {
    display: inline-block; margin-top: 38px;
    background: #2b2620; color: #f5f1e8;
    border: none; border-radius: 2px;
    padding: 15px 44px; font-size: 16px; letter-spacing: 4px;
    font-family: inherit; cursor: pointer;
    transition: opacity .2s;
  }
  .btn:active { opacity: .72; }
  .btn.ghost {
    background: transparent; color: #6a6156;
    border: 1px solid #c9bda9;
    padding: 12px 26px; font-size: 14px; letter-spacing: 1px;
    margin-top: 0;
  }

  #quiz { display: none; padding-top: 42px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #9c9285; letter-spacing: 1.5px; margin-bottom: 14px;
  }
  .bar { height: 2px; background: #e4ddd0; position: relative; margin-bottom: 40px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #8a6a4a; transition: width .35s ease; }

  .q {
    font-size: 20px; line-height: 1.85; font-weight: 500;
    margin: 0 0 32px; min-height: 3.7em;
    animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .opts { display: flex; flex-direction: column; gap: 11px; }
  .opt {
    text-align: left; width: 100%;
    background: #fffdf8; border: 1px solid #e4ddd0; border-radius: 3px;
    padding: 15px 17px; font-size: 15.5px; line-height: 1.8;
    color: #2b2620; font-family: inherit; cursor: pointer;
    transition: background .16s, border-color .16s, transform .1s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #2b2620; color: #f5f1e8; border-color: #2b2620; }

  #result { display: none; padding-top: 44px; }
  .r-eyebrow { font-size: 12px; letter-spacing: 4px; color: #9c9285; margin-bottom: 8px; }
  .r-name { font-size: 34px; letter-spacing: 8px; font-weight: 600; margin: 0 0 4px; }
  .r-person { font-size: 14px; color: #8c8378; letter-spacing: 1px; margin-bottom: 26px; }

  .r-card {
    background: #fffdf8; border: 1px solid #e4ddd0; border-radius: 3px;
    padding: 20px 19px; margin-bottom: 16px;
  }
  .r-card h3 { font-size: 12px; letter-spacing: 3px; color: #9c9285; margin: 0 0 12px; font-weight: 500; }
  .r-card p { margin: 0; font-size: 15.5px; line-height: 2.05; }
  .r-card p + p { margin-top: 10px; }

  .dim { margin-bottom: 15px; }
  .dim:last-child { margin-bottom: 0; }
  .dim .lab { display: flex; justify-content: space-between; font-size: 12px; color: #9c9285; margin-bottom: 6px; }
  .dim .track { height: 1px; background: #e4ddd0; position: relative; }
  .dim .track i { position: absolute; top: -2px; width: 5px; height: 5px; border-radius: 50%; background: #8a6a4a; }

  .quote { border-left: 2px solid #c9bda9; padding: 2px 0 2px 15px; color: #6a6156; font-size: 15px; margin: 22px 0 0; line-height: 1.95; }

  .actions { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* 保存图片浮层 */
  #shade {
    display: none; position: fixed; inset: 0; background: rgba(30,26,20,.82);
    z-index: 99; overflow: auto; padding: 30px 20px 50px;
  }
  #shade.on { display: block; }
  #shade .tip {
    color: #f5f1e8; text-align: center; font-size: 13px;
    letter-spacing: 1px; margin-bottom: 16px;
  }
  #shade img { display: block; width: 100%; max-width: 420px; margin: 0 auto; border-radius: 2px; }
  #shade .close {
    display: block; margin: 22px auto 0;
    background: none; border: 1px solid rgba(245,241,232,.5);
    color: #f5f1e8; padding: 10px 30px; font-size: 14px;
    font-family: inherit; border-radius: 2px; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="wrap">

  <section id="cover">
    <h1>你身上住着哪位古人</h1>
    <div class="line"></div>
    <p>别当历史题做。</p>
    <p>就问一句：出事那天，你身上谁先动。</p>
    <div class="hintline">三十二题 · 没有标准答案 · 别想太久</div>
    <button class="btn" id="start">开 始</button>
  </section>

  <section id="quiz">

    <div class="q" id="qText"></div>
    <div class="opts" id="opts"></div>
  </section>

  <section id="result">
    <div class="r-eyebrow">你身上住着</div>
    <h1 class="r-name" id="rName"></h1>
    <div class="r-person" id="rPerson"></div>

    <div class="r-card">

    </div>

      <div id="rDims"></div>
    </div>

    <div class="r-card">
      <h3>另外</h3>
      <div id="rExtra"></div>
    </div>

    <p class="quote" id="rQuote"></p>

    <div class="actions">
      <button class="btn ghost" id="saveBtn">存成图片</button>
      <button class="btn ghost" id="again">再测一次</button>
    </div>
  </section>

</div>

<div id="shade">
  <div class="tip">长按图片保存 · 或截图</div>
  <img id="cardImg" alt="">
  <button class="close" id="closeShade">关掉</button>
</div>

<script>

  { q: "一个明显不如你懂的人，正在指挥你",

  { q: "重复的、看不到头的活，你能干多久",

  { q: "你的独处，更像",

        ["躲", {alone:2,act:-2,direct:-1}],

  { q: "有人要做一件很傻但很勇敢的事。你",

const TYPES = [
  { n: "孤臣", person: "影子里站着的那个人：屈原",
    t: { act: 38, direct: 72, order: 84, alone: 74 },

/* ---------- 校准参数（跑过四万次随机作答，让八种结果都出得来） ---------- */
const BIAS = {
  "孤臣": 1.55, "谋士": 0.96, "隐士": 1.02, "匠人": 1.12,
  "说客": 0.72, "狂生": 0.95, "医者": 0.95, "游侠": 0.95
};

const W = { act: 1.0, direct: 1.0, order: 1.0, alone: 1.0 };

let idx = 0;
let locked = false;
let scores = { act: 0, direct: 0, order: 0, alone: 0 };
let counts = { act: 0, direct: 0, order: 0, alone: 0 };

const $ = id => document.getElementById(id);
const show = el => el.style.display = "block";
const hide = el => el.style.display = "none";

function start() {
  idx = 0;
  locked = false;
  scores = { act: 0, direct: 0, order: 0, alone: 0 };
  counts = { act: 0, direct: 0, order: 0, alone: 0 };
  hide($("cover")); hide($("result")); show($("quiz"));
  render();
}

function render() {
  locked = false;
  const q = QUESTIONS[idx];
  $("prog").textContent = String(idx + 1).padStart(2, "0") + " / " + QUESTIONS.length;
  $("barFill").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("qText").textContent = q.q;
  $("qText").style.animation = "none";
  void $("qText").offsetWidth;
  $("qText").style.animation = "";

  const box = $("opts");
  box.innerHTML = "";
  q.o.forEach(opt => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = opt[0];
    b.onclick = () => choose(b, opt[1]);
    box.appendChild(b);
  });
}

function choose(btn, delta) {
  if (locked) return;          // 手快连点两下，不会跳题
  locked = true;
  document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
  btn.classList.add("sel");
  for (const k in delta) {
    scores[k] = (scores[k] || 0) + delta[k];
    counts[k] = (counts[k] || 0) + Math.abs(delta[k]);
  }
  setTimeout(() => {
    idx++;
    if (idx >= QUESTIONS.length) finish();
    else render();
  }, 180);
}

function norm(k) {
  const c = counts[k];
  if (!c) return 50;
  const raw = scores[k] / c;
  const st = Math.sign(raw) * Math.pow(Math.abs(raw), 0.62);
  return Math.round(Math.max(5, Math.min(95, 50 + st * 55)));
}

function dist(t, v, name) {
  let s = 0;
  for (const k of DIMS) {
    const d = (t[k] - v[k]) / 100;
    s += d * d * (W[k] || 1);
  }
  return Math.sqrt(s) * (BIAS[name] || 1);
}

let CUR = null, CURV = null;

function finish() {
  hide($("quiz")); show($("result"));
  window.scrollTo({ top: 0, behavior: "smooth" });

  const v = {};
  DIMS.forEach(k => { v[k] = norm(k); });
  CURV = v;

  const ranked = TYPES.map(t => ({ t, d: dist(t.t, v, t.n) })).sort((a, b) => a.d - b.d);
  const best = ranked[0].t;
  CUR = best;

  $("rName").textContent = best.n;
  $("rPerson").textContent = best.person;

  const why = $("rWhy");
  why.innerHTML = "";
  best.why.forEach(txt => {
    const p = document.createElement("p");
    p.textContent = txt;
    why.appendChild(p);
  });

  const dims = $("rDims");
  dims.innerHTML = "";
  const LABELS = [
    ["act", "先上手", "先看着"],
    ["direct", "正面来", "绕着来"],
    ["order", "认规矩", "破规矩"],
    ["alone", "一个人扛", "找人一起"]
  ];
  LABELS.forEach(([k, hi, lo]) => {
    const div = document.createElement("div");
    div.className = "dim";
    div.innerHTML =
      '<div class="lab"><span>' + hi + '</span><span>' + lo + '</span></div>' +
      '<div class="track"><i style="left:' + Math.max(0, Math.min(100, v[k])) + '%"></i></div>';
    dims.appendChild(div);
  });

  $("rExtra").textContent = best.extra;
  $("rQuote").textContent = best.quote;
}

/* ---------------- 生成图片 ---------------- */
function wrapText(ctx, text, x, y, maxW, lineH) {
  const chars = text.split("");
  let line = "";
  let yy = y;
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line.length > 0) {
      ctx.fillText(line, x, yy);
      line = chars[i];
      yy += lineH;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, yy);
  return yy + lineH;
}

function drawCard() {
  const W_ = 750, H_ = 1180;
  const cv = document.createElement("canvas");
  cv.width = W_; cv.height = H_;
  const g = cv.getContext("2d");

  g.fillStyle = "#f5f1e8";
  g.fillRect(0, 0, W_, H_);

  // 边框
  g.strokeStyle = "#ddd5c6";
  g.lineWidth = 2;
  g.strokeRect(34, 34, W_ - 68, H_ - 68);

  const F = '"PingFang SC","Microsoft YaHei",serif';

  // 小字
  g.fillStyle = "#9c9285";
  g.font = "22px " + F;
  g.fillText("你身上住着", 72, 140);

  // 大字（逐字拉开）
  g.fillStyle = "#2b2620";
  g.font = "bold 76px " + F;
  let cx = 74;
  for (const ch of CUR.n) {
    g.fillText(ch, cx, 236);
    cx += 92;
  }

  // 代表人物
  g.fillStyle = "#8c8378";
  g.font = "24px " + F;
  g.fillText(CUR.person, 76, 288);

  // 分隔线
  g.strokeStyle = "#ddd5c6";
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(76, 334);
  g.lineTo(W_ - 76, 334);
  g.stroke();

  // quote
  g.fillStyle = "#5e564c";
  g.font = "30px " + F;
  let y = wrapText(g, CUR.quote, 76, 408, W_ - 152, 52);

  // 四个方向
  y += 40;
  g.fillStyle = "#9c9285";
  g.font = "20px " + F;
  const LAB = [
    ["act", "先上手", "先看着"],
    ["direct", "正面来", "绕着来"],
    ["order", "认规矩", "破规矩"],
    ["alone", "一个人扛", "找人一起"]
  ];
  LAB.forEach(([k, hi, lo]) => {
    g.fillStyle = "#9c9285";
    g.font = "19px " + F;
    g.fillText(hi, 76, y);
    const loW = g.measureText(lo).width;
    g.fillText(lo, W_ - 76 - loW, y);

    g.strokeStyle = "#ddd5c6";
    g.beginPath();
    g.moveTo(76, y + 22);
    g.lineTo(W_ - 76, y + 22);
    g.stroke();

    const px = 76 + (W_ - 152) * (CURV[k] / 100);
    g.fillStyle = "#8a6a4a";
    g.beginPath();
    g.arc(px, y + 22, 5, 0, Math.PI * 2);
    g.fill();

    y += 74;
  });

  // 底线
  g.fillStyle = "#a89e90";
  g.font = "19px " + F;
  g.fillText("三十二题测出来的 · 你身上住着谁", 76, H_ - 108);

  return cv.toDataURL("image/png");
}

function openShade() {
  if (!CUR || !CURV) return;
  let url;
  try {
    url = drawCard();
  } catch (e) {
    alert("图片没生成出来，截图吧。");
    return;
  }
  $("cardImg").src = url;
  $("shade").classList.add("on");
  $("cardImg").onclick = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = "古人-" + CUR.n + ".png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
}

$("start").onclick = start;
$("again").onclick = start;
$("saveBtn").onclick = openShade;
$("closeShade").onclick = () => $("shade").classList.remove("on");
</script>
